<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Choose a model and input type</title><desc id="desc">Illustration of the YOLO Vision Studio screen, highlighting the model dropdown and webcam, video, and image actions.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172752"/><stop offset="1" stop-color="#090e1b"/></linearGradient><linearGradient id="accent"><stop stop-color="#667cf5"/><stop offset="1" stop-color="#8268e8"/></linearGradient></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><circle cx="1030" cy="80" r="220" fill="#536cf1" opacity=".08"/>
  <text x="70" y="88" fill="#92a9ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">YOLO VISION STUDIO · QUICK START</text>
  <text x="70" y="145" fill="#f2f5ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">1. Choose your model and input</text>
  <rect x="70" y="185" width="1060" height="355" rx="22" fill="#121a2d" stroke="#334166" stroke-width="2"/>
  <text x="600" y="238" text-anchor="middle" fill="#93aaff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">COMPUTER VISION · YOLO</text>
  <text x="600" y="292" text-anchor="middle" fill="#f2f5ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">YOLO Vision Studio</text>
  <text x="145" y="345" fill="#edf1ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Active model</text>
  <rect x="145" y="363" width="910" height="57" rx="11" fill="#19243d" stroke="#788cff" stroke-width="2"/>
  <text x="168" y="399" fill="#ffffff" font-family="Arial,sans-serif" font-size="20">Object Detection</text><path d="m1018 385 12 12 12-12" fill="none" stroke="#bcc8ff" stroke-width="3"/>
  <rect x="145" y="446" width="280" height="60" rx="12" fill="url(#accent)"/><text x="285" y="483" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">1) Use Web Cam</text>
  <rect x="460" y="446" width="280" height="60" rx="12" fill="#19243d" stroke="#455780"/><text x="600" y="483" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">2) Upload Video</text>
  <rect x="775" y="446" width="280" height="60" rx="12" fill="#19243d" stroke="#455780"/><text x="915" y="483" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">3) Upload Image</text>
  <text x="70" y="584" fill="#b8c4df" font-family="Arial,sans-serif" font-size="18">Pick one of four tasks, then choose how you want to provide an image.</text>
