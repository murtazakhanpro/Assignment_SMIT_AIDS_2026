<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Upload media and view predictions</title><desc id="desc">Illustration of selecting an image or video, running inference, and viewing an annotated output or downloading the processed video.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172752"/><stop offset="1" stop-color="#090e1b"/></linearGradient><linearGradient id="accent"><stop stop-color="#667cf5"/><stop offset="1" stop-color="#8268e8"/></linearGradient></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="70" y="88" fill="#92a9ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">IMAGE AND VIDEO MODE</text>
  <text x="70" y="145" fill="#f2f5ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">3. Upload, process, view</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="200" width="310" height="310" rx="20" fill="#121a2d" stroke="#334166" stroke-width="2"/><circle cx="225" cy="300" r="54" fill="#202e52"/><path d="M225 269v65m-25-24 25 25 25-25" fill="none" stroke="#9fb0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="405" text-anchor="middle" fill="#f2f5ff" font-size="23" font-weight="700">Choose Image or Video</text><text x="225" y="440" text-anchor="middle" fill="#aeb9d3" font-size="17">Pick a file from your device</text>
    <path d="M405 355h100" stroke="#8fa4ff" stroke-width="5"/><path d="m491 338 20 17-20 17" fill="none" stroke="#8fa4ff" stroke-width="5"/>
    <rect x="540" y="200" width="310" height="310" rx="20" fill="#121a2d" stroke="#334166" stroke-width="2"/><circle cx="695" cy="300" r="54" fill="#202e52"/><path d="M675 300h40m-20-20v40" stroke="#9fb0ff" stroke-width="8" stroke-linecap="round"/><text x="695" y="405" text-anchor="middle" fill="#f2f5ff" font-size="23" font-weight="700">Model runs on CPU</text><text x="695" y="440" text-anchor="middle" fill="#aeb9d3" font-size="17">Wait for inference to finish</text>
    <path d="M875 355h100" stroke="#8fa4ff" stroke-width="5"/><path d="m961 338 20 17-20 17" fill="none" stroke="#8fa4ff" stroke-width="5"/>
    <rect x="1010" y="200" width="120" height="310" rx="20" fill="#121a2d" stroke="#334166" stroke-width="2"/><rect x="1031" y="250" width="78" height="118" rx="9" fill="#090e1b" stroke="#536cf1" stroke-width="2"/><path d="M1042 346 1062 320 1078 333 1096 299" fill="none" stroke="#8fa4ff" stroke-width="4"/><text x="1070" y="414" text-anchor="middle" fill="#f2f5ff" font-size="17" font-weight="700">View result</text><text x="1070" y="445" text-anchor="middle" fill="#aeb9d3" font-size="14">Download video</text>
  </g>
  <text x="70" y="564" fill="#b8c4df" font-family="Arial,sans-serif" font-size="18">Images appear in the app. Processed videos include a download link.</text>
</svg>
